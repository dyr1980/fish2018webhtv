<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webHTV · 手机端设置页 · 午夜首映</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body{display:flex;justify-content:center;padding:28px 0;
    background:#060709 radial-gradient(900px 480px at 50% -8%,rgba(232,163,61,.07),transparent 65%);}
  .phone{position:relative;width:390px;height:844px;overflow:hidden;
    border-radius:48px;border:1px solid #23242C;background:var(--ink);box-shadow:var(--sh-3);}
  .scroll{height:100%;overflow-y:auto;padding-bottom:110px;}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:22px 20px 14px;background:linear-gradient(180deg,var(--ink) 66%,transparent);}
  .topbar h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:2px;}
  .topbar .ver{margin-left:auto;font-size:11.5px;color:var(--mist-dim);}

  /* ── 收藏 / 历史 / 本地 入口 ───────── */
  .shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:2px 20px 0;}
  .sc{position:relative;min-height:150px;padding:16px;border-radius:var(--r-lg);overflow:hidden;
    background:var(--panel);border:1px solid var(--line);}
  .sc b{margin-top:34px;}
  .sc .ic{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;
    background:rgba(232,163,61,.12);color:var(--amber);}
  .sc span i{font-style:normal;color:var(--seal);font-weight:600;}
  .sc b{display:block;margin-top:12px;font-family:var(--f-display);font-weight:900;font-size:16px;letter-spacing:1px;}
  .sc span{display:block;margin-top:4px;font-size:11.5px;color:var(--mist-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sc .go{position:absolute;bottom:18px;right:14px;color:var(--mist-dim);font-size:14px;}
  .sc .mini{position:absolute;right:14px;top:16px;display:flex;}
  .sc .mini i{width:26px;height:36px;border-radius:5px;border:1.5px solid var(--ink);margin-left:-8px;}

  /* ── 设置组 ───────────────────────── */
  .grp{margin-top:26px;padding:0 20px;}
  .grp-title{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:2px;
    color:var(--mist);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .grp-title::before{content:"";width:4px;height:4px;transform:rotate(45deg);background:var(--amber);}
  .card{border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line);overflow:hidden;}
  .item{display:flex;align-items:center;gap:12px;padding:15px 16px;}
  .item+.item{border-top:1px solid var(--line);}
  .item .lb{font-size:14px;font-weight:500;}
  .item .hint{margin-top:3px;font-size:11px;color:var(--mist-dim);}
  .item .val{margin-left:auto;font-size:12.5px;color:var(--mist);display:flex;align-items:center;gap:7px;}
  .item .val b{color:var(--amber);font-weight:600;}
  .item .arr{color:var(--mist-dim);font-size:13px;}
  .switch{margin-left:auto;width:42px;height:24px;border-radius:999px;background:var(--amber);position:relative;}
  .switch::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#20150A;}
  .switch.off{background:var(--panel-2);border:1px solid var(--line-2);}
  .switch.off::after{left:3px;right:auto;background:var(--mist-dim);}

  .danger .lb{color:var(--seal);}
  .foot-note{margin:26px 20px 0;text-align:center;font-size:11px;color:var(--mist-dim);line-height:1.9;}

  /* ── 底部导航 ─────────────────────── */
  .tabbar{position:absolute;z-index:40;left:16px;right:16px;bottom:16px;height:62px;
    display:flex;align-items:center;justify-content:space-around;
    border-radius:22px;background:rgba(21,26,36,.78);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
    box-shadow:var(--sh-2);}
  .nav{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mist-dim);}
  .nav .ic{font-size:19px;line-height:1;}
  .nav.on{color:var(--paper);}
  .nav.on .lb{font-family:var(--f-display);font-weight:900;}
  .nav::before{content:"";width:4px;height:4px;background:transparent;margin-bottom:1px;}
  .nav.on::before{transform:rotate(45deg);background:var(--amber);}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">

    <div class="topbar"><h1>设置</h1><span class="ver">v5.5.5 · 已是最新</span></div>

    <div class="shortcuts">
      <div class="sc">
        <div class="ic">✦</div>
        <b>我的收藏</b><span>18 部 · <i>2 部有更新</i></span>
        <div class="go">›</div>
        <div class="mini"><i class="art art-mist"></i><i class="art art-red"></i><i class="art art-wuxia"></i></div>
      </div>
      <div class="sc">
        <div class="ic">◷</div>
        <b>观看历史</b><span>26 条 · 昨晚看到第 8 集</span>
        <div class="go">›</div>
        <div class="mini"><i class="art art-cold"></i><i class="art art-warm"></i><i class="art art-space"></i></div>
      </div>
    </div>

    <div class="grp">
      <div class="grp-title">数据源</div>
      <div class="card">
        <div class="item"><div><div class="lb">点播源</div><div class="hint">长按可测速并优选</div></div>
          <div class="val"><b>非凡影视</b>· 486 部<span class="arr">›</span></div></div>
        <div class="item"><div><div class="lb">直播源</div></div>
          <div class="val"><b>默认线路</b>· 128 频道<span class="arr">›</span></div></div>
        <div class="item"><div><div class="lb">配置地址</div><div class="hint">更新于今天 08:12</div></div>
          <div class="val">已订阅 3 个<span class="arr">›</span></div></div>
      </div>
    </div>

    <div class="grp">
      <div class="grp-title">播放</div>
      <div class="card">
        <div class="item"><div class="lb">播放器</div><div class="val"><b>EXO</b>· 硬解<span class="arr">›</span></div></div>
        <div class="item"><div class="lb">画面比例</div><div class="val">自适应<span class="arr">›</span></div></div>
        <div class="item"><div class="lb">弹幕</div><div class="switch"></div></div>
        <div class="item"><div><div class="lb">自动连播</div><div class="hint">播完当前集自动进入下一集</div></div><div class="switch"></div></div>
      </div>
    </div>

    <div class="grp">
      <div class="grp-title">通用</div>
      <div class="card">
        <div class="item"><div class="lb">投屏 · DLNA</div><div class="switch off"></div></div>
        <div class="item"><div class="lb">清理缓存</div><div class="val">1.2 GB<span class="arr">›</span></div></div>
        <div class="item danger"><div class="lb">恢复默认设置</div><div class="val"><span class="arr">›</span></div></div>
      </div>
    </div>

    <div class="foot-note">webHTV · 午夜首映<br>内容来自第三方站点聚合，仅供学习交流</div>
  </div>

  <div class="tabbar">
    <div class="nav"><span class="ic">⌂</span><span class="lb">首页</span></div>
    <div class="nav"><span class="ic">📡</span><span class="lb">直播</span></div>
    <div class="nav on"><span class="ic">⚙</span><span class="lb">设置</span></div>
  </div>
</div>
</body>
</html>
