<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webHTV · 手机端我的收藏 · 午夜首映</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body{display:flex;justify-content:center;padding:28px 0;
    background:#060709 radial-gradient(900px 480px at 50% -8%,rgba(232,163,61,.07),transparent 65%);}
  .phone{position:relative;width:390px;height:844px;overflow:hidden;
    border-radius:48px;border:1px solid #23242C;background:var(--ink);box-shadow:var(--sh-3);}
  .scroll{height:100%;overflow-y:auto;padding-bottom:40px;}

  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
    padding:22px 20px 14px;background:linear-gradient(180deg,var(--ink) 66%,transparent);}
  .back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:var(--panel);border:1px solid var(--line);color:var(--paper);}
  .topbar h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:2px;}
  .topbar .count{font-size:11.5px;color:var(--mist-dim);margin-top:2px;}
  .edit{margin-left:auto;font-size:13px;color:var(--mist);padding:7px 15px;
    border-radius:var(--r-pill);border:1px solid var(--line-2);}

  .filters{display:flex;gap:9px;padding:2px 20px 16px;}
  .ft{font-size:12px;color:var(--mist);padding:6px 14px;border-radius:var(--r-pill);
    border:1px solid var(--line-2);}
  .ft.on{background:rgba(232,163,61,.12);border-color:var(--amber);color:var(--amber);font-weight:600;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:0 20px;}
  .gd .pic{position:relative;aspect-ratio:2/2.82;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1);}
  .gd .up{position:absolute;z-index:2;top:8px;left:8px;font-size:9.5px;font-weight:700;color:var(--paper);
    padding:3px 8px;border-radius:var(--r-pill);background:var(--seal);box-shadow:var(--sh-1);}
  .gd .ep{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:16px 8px 6px;text-align:right;
    font-size:10.5px;color:var(--paper);background:linear-gradient(transparent,rgba(11,13,19,.88));}
  .gd .name{margin-top:8px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gd .sub{margin-top:2px;font-size:11px;color:var(--mist-dim);}
  .gd .sub b{color:var(--amber);font-weight:500;}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">

    <div class="topbar">
      <div class="back">‹</div>
      <div><h1>我的收藏</h1><div class="count">18 部 · 2 部有更新</div></div>
      <div class="edit">编辑</div>
    </div>

    <div class="filters">
      <div class="ft on">全部 18</div><div class="ft">剧集 11</div>
      <div class="ft">电影 5</div><div class="ft">动漫 2</div>
    </div>

    <div class="grid">
      <div class="gd"><div class="pic art art-mist"><span class="up">更新 2 集</span><div class="ep">更新至 12 集</div></div>
        <div class="name">雾岛来客</div><div class="sub"><b>追到第 6 集</b></div></div>
      <div class="gd"><div class="pic art art-cold"><span class="up">今日更新</span><div class="ep">更新至 12 集</div></div>
        <div class="name">暗涌</div><div class="sub"><b>追到第 8 集</b></div></div>
      <div class="gd"><div class="pic art art-red"><div class="ep">更新至 18 集</div></div>
        <div class="name">铜雀台之夜</div><div class="sub">追到第 15 集</div></div>
      <div class="gd"><div class="pic art art-wuxia"><div class="ep">全 36 集</div></div>
        <div class="name">山河入梦</div><div class="sub">看到第 2 集</div></div>
      <div class="gd"><div class="pic art art-space"><div class="ep">全 10 集</div></div>
        <div class="name">深空回响</div><div class="sub">看到第 6 集</div></div>
      <div class="gd"><div class="pic art art-sea"><div class="ep">HD 中字</div></div>
        <div class="name">月落大江</div><div class="sub">已看完</div></div>
      <div class="gd"><div class="pic art art-dusk"><div class="ep">HD 国语</div></div>
        <div class="name">纸鸢</div><div class="sub">未开始</div></div>
      <div class="gd"><div class="pic art art-green"><div class="ep">全 24 集</div></div>
        <div class="name">南方有风</div><div class="sub">看到第 12 集</div></div>
      <div class="gd"><div class="pic art art-warm"><div class="ep">更新至 3 集</div></div>
        <div class="name">春溪食堂</div><div class="sub">追到第 3 集</div></div>
    </div>

  </div>
</div>
</body>
</html>
